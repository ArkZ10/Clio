[project]
name = "clio"
version = "0.1.0"
description = "Clio (Research Atlas) backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.137.2",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "sqlite-vec==0.1.9",
    "scikit-learn==1.9.0",
    "numpy==2.4.6",
    "arxiv==4.0.0",
    "pymupdf4llm==1.27.2.3",
    "sentence-transformers==5.6.0",
    "torch==2.12.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "llm_switch",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv.sources]
llm_switch = { path = "packages/llm_switch", editable = true }
