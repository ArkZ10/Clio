<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A29A3"/>
      <stop offset="100%" stop-color="#3D155D"/>
    </linearGradient>
  </defs>
  <!-- Clio's mark: three linked nodes, echoing the wikilink graph that is the
       app's centerpiece (vault / library / explore all render this shape).
       Palette is exactly the app's own: #7A29A3 primary -> #3D155D elevated,
       on the #0B0B0B-family surface, matching web/src/styles.css. -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#0B0B0B"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#bg)"/>
  <g stroke="#F4EEFB" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="32" y1="21" x2="21" y2="43"/>
    <line x1="32" y1="21" x2="43" y2="43"/>
    <line x1="21" y1="43" x2="43" y2="43"/>
  </g>
  <circle cx="32" cy="21" r="6.5" fill="#F4EEFB"/>
  <circle cx="21" cy="43" r="5" fill="#F4EEFB" fill-opacity="0.92"/>
  <circle cx="43" cy="43" r="5" fill="#F4EEFB" fill-opacity="0.92"/>
</svg>
